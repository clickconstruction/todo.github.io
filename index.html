<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo Tooling</title>
<meta name="description" content="Capture, clarify and do: a GTD inbox, projects and tags.">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Todo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="vendor/supabase-js-2.108.0.min.js"></script>
<script src="config.js"></script>
<script>
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    document.write('<script src="config.local.js" onerror="this.remove()"><\/script>');
    // ?mock swaps Supabase for the in-memory test harness (dev/mock-supabase.js).
    if (/[?&]mock\b/.test(location.search)) document.write('<script src="dev/mock-supabase.js"><\/script>');
  }
</script>
<script src="supabase-client.js"></script>
</head>
<body>
<div id="auth" class="auth" hidden>
  <form id="auth-form" class="auth-card">
    <img src="icons/icon-192.png" alt="" width="64" height="64">
    <h1>Todo Tooling</h1>
    <input id="auth-email" type="email" autocomplete="username" placeholder="Email" required>
    <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password" required minlength="8">
    <button type="submit" class="btn primary">Sign in</button>
    <button type="button" id="auth-signup" class="btn link">Create account</button>
    <p id="auth-msg" class="auth-msg" role="status"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav class="tabs" aria-label="Views">
    <a href="#search" data-view="search" class="desktop-only"><span class="tab-icon">🔍</span><span>Search</span></a>
    <button type="button" class="desktop-only nav-focus" data-act="focus"><span class="tab-icon">🎯</span><span>Focus</span></button>
    <a href="#inbox" data-view="inbox"><span class="tab-icon">📥</span><span>Inbox</span><b class="badge" id="badge-inbox"></b></a>
    <a href="#forecast" data-view="forecast"><span class="tab-icon">📅</span><span>Forecast</span><b class="badge due" id="badge-forecast"></b></a>
    <a href="#flagged" data-view="flagged"><span class="tab-icon">🚩</span><span>Flagged</span><b class="badge flag" id="badge-flagged"></b></a>
    <a href="#now" data-view="now" class="desktop-only"><span class="tab-icon">▶️</span><span>What now?</span></a>
    <a href="#projects" data-view="projects"><span class="tab-icon">🗂️</span><span>Projects</span></a>
    <div id="nav-perspectives" class="nav-perspectives"></div>
    <a href="#nearby" data-view="nearby" class="desktop-only"><span class="tab-icon">📍</span><span>Nearby</span><b class="badge here" id="badge-nearby"></b></a>
    <a href="#waiting" data-view="waiting" class="desktop-only"><span class="tab-icon">⏳</span><span>Waiting For</span><b class="badge due" id="badge-waiting"></b></a>
    <a href="#tickler" data-view="tickler" class="desktop-only"><span class="tab-icon">📆</span><span>Tickler</span></a>
    <a href="#reference" data-view="reference" class="desktop-only"><span class="tab-icon">🗄️</span><span>Reference</span></a>
    <a href="#checklists" data-view="checklists" class="desktop-only"><span class="tab-icon">☑️</span><span>Checklists</span></a>
    <a href="#horizons" data-view="horizons" class="desktop-only"><span class="tab-icon">🏔️</span><span>Horizons</span></a>
    <a href="#someday" data-view="someday" class="desktop-only"><span class="tab-icon">💭</span><span>Someday/Maybe</span></a>
    <a href="#weekly" data-view="weekly" class="desktop-only"><span class="tab-icon">🧭</span><span>Weekly Review</span><b class="badge review" id="badge-review"></b></a>
    <a href="#tags" data-view="tags" class="desktop-only"><span class="tab-icon">🏷️</span><span>Tags</span></a>
    <a href="#done" data-view="done" class="desktop-only"><span class="tab-icon">✅</span><span>Done</span></a>
    <a href="#settings" data-view="settings" class="desktop-only"><span class="tab-icon">⚙️</span><span>Settings</span></a>
    <button type="button" class="mobile-only more-tab" id="more-tab" data-view="more"><span class="tab-icon">⋯</span><span>More</span></button>
  </nav>
  <a href="#search" class="search-fab" aria-label="Search">🔍</a>
  <main id="view" class="view"></main>
  <aside id="inspector" class="inspector" hidden aria-label="Inspector"></aside>
  <button type="button" id="fab" class="fab" aria-label="New inbox item">+</button>
</div>

<dialog id="sheet" class="sheet"></dialog>
<dialog id="sheet2" class="sheet sheet-top"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
